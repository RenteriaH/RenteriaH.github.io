name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tipos (astro check)
        run: npm run check
      - name: Integridad del contenido
        run: npm test
      - name: Compilación
        run: npx astro build
      - name: Pruebas de punta a punta (Chrome del runner)
        run: |
          (cd dist && python3 -m http.server 4321 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 2
          BASE=http://127.0.0.1:4321 npm run test:e2e
