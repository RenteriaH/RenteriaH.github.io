name: Desplegar en GitHub Pages

# Se publica solo desde main y solo si pasan tipos, pruebas de contenido y e2e.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx astro build
      - name: Pruebas de punta a punta sobre lo que se va a publicar
        run: |
          (cd dist && python3 -m http.server 4321 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 2
          BASE=http://127.0.0.1:4321 npm run test:e2e
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
